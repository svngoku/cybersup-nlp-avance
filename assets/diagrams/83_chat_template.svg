<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="375" viewBox="0 0 1200 375" role="img" aria-labelledby="title desc">
<title id="title">chat template</title><desc id="desc">Les messages system, user et assistant deviennent un texte avec marqueurs im_start et im_end, puis le tokenizer produit les identifiants des marqueurs et du contenu.</desc>
<defs>
<marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#282A59"/></marker>
<marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#BF2E00"/></marker>
<marker id="grey-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#565968"/></marker>
</defs>
<rect width="1200" height="375" fill="white"/>
<text x="164" y="30" font-family="DM Sans, Arial, sans-serif" font-size="27" font-weight="600" fill="#282A59" text-anchor="middle">
<tspan x="164" dy="0">Messages</tspan>
</text>
<rect x="20" y="48" width="284" height="78" rx="14" fill="#F0F1F7" stroke="#282A59" stroke-width="2"/>
<text x="162.0" y="80.1" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#282A59" text-anchor="middle">
<tspan x="162.0" dy="0">system</tspan>
<tspan x="162.0" dy="32">Style concis.</tspan>
</text>
<rect x="20" y="150" width="284" height="78" rx="14" fill="#F0F1F7" stroke="#282A59" stroke-width="2"/>
<text x="162.0" y="182.1" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#282A59" text-anchor="middle">
<tspan x="162.0" dy="0">user</tspan>
<tspan x="162.0" dy="32">Où est AB123 ?</tspan>
</text>
<rect x="20" y="252" width="284" height="78" rx="14" fill="#FFF0E8" stroke="#BF2E00" stroke-width="2"/>
<text x="162.0" y="284.1" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#BF2E00" text-anchor="middle">
<tspan x="162.0" dy="0">assistant</tspan>
<tspan x="162.0" dy="32">Je vérifie.</tspan>
</text>
<polyline points="306,190 375,190" fill="none" stroke="#282A59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<text x="610" y="30" font-family="DM Sans, Arial, sans-serif" font-size="27" font-weight="600" fill="#282A59" text-anchor="middle">
<tspan x="610" dy="0">Texte rendu</tspan>
</text>
<rect x="388" y="46" width="445" height="304" rx="14" fill="#F0F1F7" stroke="#282A59" stroke-width="2"/>
<text x="405" y="75" font-family="Roboto Mono, monospace" font-size="25" font-weight="500" fill="#171923" text-anchor="start">
<tspan x="405" dy="0">&lt;|im_start|&gt;system</tspan>
<tspan x="405" dy="48">Style concis.&lt;|im_end|&gt;</tspan>
<tspan x="405" dy="48">&lt;|im_start|&gt;user</tspan>
<tspan x="405" dy="48">Où est AB123 ?&lt;|im_end|&gt;</tspan>
<tspan x="405" dy="48">&lt;|im_start|&gt;assistant</tspan>
<tspan x="405" dy="48">Je vérifie.&lt;|im_end|&gt;</tspan>
</text>
<polyline points="836,190 894,190" fill="none" stroke="#282A59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<text x="1036" y="81" font-family="DM Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#282A59" text-anchor="middle">
<tspan x="1036" dy="0">Tokenizer</tspan>
</text>
<rect x="907" y="108" width="264" height="62" rx="14" fill="#F0F1F7" stroke="#282A59" stroke-width="2"/>
<text x="1039.0" y="147.75" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#282A59" text-anchor="middle">
<tspan x="1039.0" dy="0">IDs des marqueurs</tspan>
</text>
<rect x="907" y="188" width="264" height="62" rx="14" fill="#FFF0E8" stroke="#BF2E00" stroke-width="2"/>
<text x="1039.0" y="227.75" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#BF2E00" text-anchor="middle">
<tspan x="1039.0" dy="0">IDs du texte</tspan>
</text>
<text x="1039" y="302" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="500" fill="#565968" text-anchor="middle">
<tspan x="1039" dy="0">IDs illustratifs</tspan>
</text>
</svg>
