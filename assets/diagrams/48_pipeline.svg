<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="375" viewBox="0 0 1200 375" role="img" aria-labelledby="title desc">
<title id="title">pipeline</title><desc id="desc">Un message est tokenisé en identifiants et masque, traité par le modèle qui produit des logits, puis post-traité pour obtenir une catégorie.</desc>
<defs>
<marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#282A59"/></marker>
<marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#BF2E00"/></marker>
<marker id="grey-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#565968"/></marker>
</defs>
<rect width="1200" height="375" fill="white"/>
<text x="27" y="51" font-family="DM Sans, Arial, sans-serif" font-size="27" font-weight="500" fill="#565968" text-anchor="start">
<tspan x="27" dy="0">Exemple : classification d’un message</tspan>
</text>
<rect x="23" y="135" width="180" height="111" rx="14" fill="#F0F1F7" stroke="#282A59" stroke-width="2"/>
<text x="113.0" y="183.6" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#282A59" text-anchor="middle">
<tspan x="113.0" dy="0">« colis</tspan>
<tspan x="113.0" dy="32">perdu »</tspan>
</text>
<rect x="262" y="135" width="200" height="111" rx="14" fill="#F0F1F7" stroke="#282A59" stroke-width="2"/>
<text x="362.0" y="183.6" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#282A59" text-anchor="middle">
<tspan x="362.0" dy="0">Tokenizer</tspan>
<tspan x="362.0" dy="32">IDs + masque</tspan>
</text>
<rect x="521" y="135" width="183" height="111" rx="14" fill="#F0F1F7" stroke="#282A59" stroke-width="2"/>
<text x="612.5" y="183.6" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#282A59" text-anchor="middle">
<tspan x="612.5" dy="0">Modèle</tspan>
<tspan x="612.5" dy="32">logits</tspan>
</text>
<rect x="763" y="135" width="200" height="111" rx="14" fill="#FFF0E8" stroke="#BF2E00" stroke-width="2"/>
<text x="863.0" y="183.6" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#BF2E00" text-anchor="middle">
<tspan x="863.0" dy="0">Post-traiter</tspan>
<tspan x="863.0" dy="32">argmax</tspan>
</text>
<rect x="1022" y="135" width="156" height="111" rx="14" fill="#FFF0E8" stroke="#BF2E00" stroke-width="2"/>
<text x="1100.0" y="183.6" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#BF2E00" text-anchor="middle">
<tspan x="1100.0" dy="0">Catégorie</tspan>
<tspan x="1100.0" dy="32">livraison</tspan>
</text>
<polyline points="203,190 256,190" fill="none" stroke="#282A59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<polyline points="462,190 515,190" fill="none" stroke="#282A59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<polyline points="704,190 757,190" fill="none" stroke="#282A59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<polyline points="963,190 1016,190" fill="none" stroke="#282A59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<text x="362" y="291" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="500" fill="#565968" text-anchor="middle">
<tspan x="362" dy="0">IDs illustratifs</tspan>
</text>
<text x="612" y="291" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="500" fill="#565968" text-anchor="middle">
<tspan x="612" dy="0">scores de classes</tspan>
</text>
<text x="861" y="291" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="500" fill="#565968" text-anchor="middle">
