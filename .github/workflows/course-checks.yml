name: Course structure and CPU smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  course-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the lightweight CPU verification dependency
        run: python -m pip install numpy==2.1.3
      - name: Rebuild and check notebook structure and toy calculations
        run: python scripts/build_notebooks.py --smoke
      - name: Confirm notebook generation is reproducible
        run: git diff --exit-code -- notebooks
      - name: Check presentation, images, notes and distribution packs
        run: |
          mkdir -p .build
          python scripts/validate_and_pack.py
      - name: Explain the validation boundary
        run: echo 'Structure and lightweight CPU calculations checked. Full T4/L4 notebook execution is a separate rehearsal.'
